[package]
name = "linux_hello"
version = "0.1.0"
edition = "2021"
authors = ["Cole Leavitt"]
description = "Windows Hello-compatible face authentication for Linux"
license = "MIT"
repository = "https://github.com/coleleavitt/linux_hello"

[dependencies]
# ONNX Runtime
ort = { version = "2.0.0-rc.9", features = ["download-binaries", "ndarray"] }

# Image processing
image = "0.25"

# V4L2 camera
v4l = "0.14"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Error handling
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# TPM sealing of the face store (feature "tpm")
tss-esapi = { version = "7.7", optional = true }
aes-gcm = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }
zeroize = { version = "1", optional = true }

[workspace]
members = [".", "pam"]

default = []
# Seal the face store with a TPM 2.0 (needs tpm2-tss); see docs/tpm.md
tpm = ["dep:tss-esapi", "dep:aes-gcm", "dep:base64", "dep:zeroize"]

[[test]]
name = "tpm"
required-features = ["tpm"]
harness = false

[profile.release]
lto = true
codegen-units = 1
